    <!-- 8 sprocket holes -->
    <circle cx="32" cy="5" r="2.5" fill="#E30613"/>
    <circle cx="51" cy="13" r="2.5" fill="#E30613"/>
    <circle cx="59" cy="32" r="2.5" fill="#E30613"/>
    <circle cx="51" cy="51" r="2.5" fill="#E30613"/>
    <circle cx="32" cy="59" r="2.5" fill="#E30613"/>
    <circle cx="13" cy="51" r="2.5" fill="#E30613"/>
    <circle cx="5" cy="32" r="2.5" fill="#E30613"/>
    <circle cx="13" cy="13" r="2.5" fill="#E30613"/>

    <!-- Spokes -->
    <line x1="32" y1="32" x2="32" y2="15" stroke="#E30613" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="46" y2="23" stroke="#E30613" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="46" y2="41" stroke="#E30613" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="32" y2="49" stroke="#E30613" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="18" y2="41" stroke="#E30613" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="18" y2="23" stroke="#E30613" stroke-width="2" stroke-linecap="round"/>

    <!-- Center hub -->
    <circle cx="32" cy="32" r="8" fill="#E30613"/>
    <circle cx="32" cy="32" r="4" fill="#1a1a1a"/>

    <!-- Play triangle -->
    <polygon points="30,28 30,36 37,32" fill="#ffffff"/>
