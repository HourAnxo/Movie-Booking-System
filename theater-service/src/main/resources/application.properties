spring.application.name=theater-service

server.port=8084

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/theater_db
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ================= ACTUATOR =================
# health and info only. env, beans, loggers and heapdump stay closed — these
# services run permitAll() filter chains and trust the gateway, so anything
# exposed here is exposed to whatever can reach the port.
management.endpoints.web.exposure.include=health,info

# Adds /actuator/health/liveness and /actuator/health/readiness for probes.
management.endpoint.health.probes.enabled=true

# Development setting. The ports are not published outside the compose
# network, but on a real deployment this tells anyone who can reach it
# exactly which dependency is broken.
management.endpoint.health.show-details=always

# Report real health to Eureka rather than "the process is running".
# A service whose database has gone is then marked DOWN in the registry and
# callers stop being handed it — the difference between one broken service
# and every caller timing out against it.
eureka.client.healthcheck.enabled=true
